name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Content is valid and the bundle is up to date
        run: pnpm content:check
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (mobile)
        run: pnpm --filter mobile lint
      - name: Bundle Expo web
        run: pnpm --filter mobile exec expo export --platform web

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16 server binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - name: Migrations + RLS tests
        run: PATH="/usr/lib/postgresql/16/bin:$PATH" bash supabase/tests/run.sh
