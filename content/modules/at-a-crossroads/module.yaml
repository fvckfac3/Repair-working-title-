slug: at-a-crossroads
title: At a Crossroads
tier: D
order: 14
tagline: Get clear on whether and how to move forward.
description: >-
  Often one partner is leaning in and the other is leaning out. This
  module doesn't push you to stay together. It helps each of you get clear
  about where you are, your own part in the problems, and the path you
  choose: keep things as they are, separate, or commit fully to a
  time-limited effort to repair.
