id: aac-lesson-mixed
module: at-a-crossroads
type: lesson
title: When partners want different things
summary: Make space for uncertainty and different levels of readiness without labeling either person.
minutes: 5
mode: solo
intensity: deep
cards:
  - heading: Different positions can coexist
    body: One person may want to work on the relationship while another is unsure, considering
      separation, or not ready to name a position. Either person can change their mind, and no
      position is a moral failure.
  - heading: Uncertainty is not a vote
    body: A person does not owe an immediate decision, a complete explanation, or a promise to stay. The
      other person can also set limits on how long they are willing to remain in uncertainty.
      Neither can dictate the other’s choice.
  - heading: Make space without extracting answers
    body: If both can speak freely and want to talk, ask “Would you like to share anything about where
      you are?” Accept “not now” as a complete answer. Do not ask for private writings or assessment
      results.
  - heading: Support does not require agreement
    body: Each person may seek individual counseling or other trusted support without a shared decision.
      If fear, coercion or violence is present, do not use joint discernment; contact an individual
      domestic abuse specialist if safe.
takeaway:
  question: What is a respectful response to “I am not ready to say”?
  options:
    - Demand a deadline and private journal entries.
    - Accept the answer and consider your own needs independently.
    - Treat uncertainty as a promise to stay.
  answer: 1
  explanation: A person may decide what to share and when; the other can also consider their own boundaries.
