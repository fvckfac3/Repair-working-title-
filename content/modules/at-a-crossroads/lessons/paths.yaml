id: aac-lesson-paths
module: at-a-crossroads
type: lesson
title: Possible paths forward
summary: Consider staying, separating, a limited effort, or taking time without implying one is best.
minutes: 5
mode: solo
intensity: deep
cards:
  - heading: More than one next step
    body: Possible paths include continuing the current arrangement, taking time to gather information,
      trying a limited change while staying, or exploring separation. These are options, not a
      required sequence or exhaustive list.
  - heading: Consider costs and needs
    body: For each option, notice what might improve, what could remain difficult, and what practical
      questions arise around housing, care, work or support. You do not need to solve these
      questions in the app or disclose private plans.
  - heading: A decision belongs to each person
    body: A relationship effort requires ongoing voluntary participation; a person may choose not to
      continue it. Separation does not require the other person’s agreement to your internal
      decision. Avoid treating either outcome as failure.
  - heading: Get information safely
    body: For personal legal, financial, housing or parenting questions, consult an appropriate
      independent local professional or support service. If leaving or discussing a change could
      increase danger, seek individual domestic abuse specialist support using a safer device.
takeaway:
  question: What can this module determine about the right path?
  options:
    - A score can determine whether you should separate.
    - It cannot decide; you may explore options and seek independent information.
    - Everyone should try the same six-month program first.
  answer: 1
  explanation: Only you can make your own decisions; choices and timing depend on your circumstances and safety.
