slug: fighting-fair
title: Fighting Fair
tier: A
order: 3
tagline: Disagree without damage, and repair when you slip.
description: >-
  Some problems can be solved and some are permanent differences you learn
  to live with. This module helps you tell them apart, use repair attempts
  in the middle of a fight, find compromise without losing yourself, and
  talk through a past fight without starting it again.
status: draft
intensity: medium
outline:
  assessment: Conflict Style Profile
  lessons:
    - Solvable vs. perpetual problems
    - Repair attempts
    - Compromise without losing yourself
    - The dreams inside gridlock
    - Accepting influence
  exercises:
    - Sort our issues
    - Our repair phrase deck
    - Core needs vs. flexible areas
  conversations:
    - Solving a solvable problem
    - The dream within the conflict
    - Debriefing a past fight
  journal: My part in the pattern
  ritual: 7-day repair attempt challenge
