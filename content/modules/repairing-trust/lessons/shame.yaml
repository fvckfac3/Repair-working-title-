id: rt-lesson-shame
module: repairing-trust
type: lesson
title: Shame vs. guilt for the partner who broke trust
summary: Use discomfort as a prompt for ownership, not a request to be reassured.
minutes: 4
mode: solo
intensity: light
cards:
  - heading: Distinguish action from identity
    body: “I did something harmful” focuses on an action and possible repair. “I am irredeemable” can
      consume the conversation without helping the affected person. Feelings are real, but they do
      not themselves repair harm.
  - heading: Avoid making the hurt person manage your distress
    body: You might say “I need a moment to steady myself; I will seek support separately.” Do not
      demand that the affected person comfort you or tell you that you are a good person.
  - heading: Return to the actionable part
    body: Write what you did, what the impact was if known, and what action you can take or offer. If
      the other person declines contact, respect that decision and work on your behavior
      independently.
  - heading: Own only your own conduct
    body: Shame is not an excuse or a reason to accept responsibility for someone else’s coercion or
      violence. Individual support can help you sort responsibility and boundaries without forcing a
      joint process.
takeaway:
  question: What is a constructive response to shame after causing harm?
  options:
    - Ask the hurt person to reassure you immediately.
    - Seek support separately and focus on the action you can own.
    - Avoid discussing your behavior forever.
  answer: 1
  explanation: Separately managing distress leaves room for accountability without demanding comfort.
