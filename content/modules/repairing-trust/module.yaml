slug: repairing-trust
title: Repairing Trust
tier: B
order: 4
tagline: Rebuild reliability one kept promise at a time.
description: >-
  Trust wears down in many ways: broken promises, lies big and small,
  secrecy, and not showing up when it mattered. This module looks at how
  trust is built in small moments and what real accountability is, and it
  gives you a structure for repair that relies on consistency, not grand
  gestures.
