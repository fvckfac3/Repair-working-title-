id: hai-lesson-responding-without-defensiveness
module: healing-after-infidelity
type: lesson
title: Responding without defensiveness
summary: "For someone who broke trust: acknowledge impact while respecting boundaries."
minutes: 4
mode: solo
intensity: medium
cards:
  - heading: Pause your defense
    body: Hearing hurt can bring shame or an urge to correct every detail. Take a breath. You can say,
      “I want to understand; may I take a moment?” A pause is not permission to disappear or demand
      reassurance.
  - heading: Own the action
    body: "Try: “I chose to hide that contact. I understand that discovering it changed how safe our
      agreements felt. I am sorry.” Avoid “I am sorry you feel that way” or explanations that shift
      responsibility."
  - heading: Offer a specific next action
    body: "Instead of asking for instant trust, name something feasible: “I will tell you if unavoidable
      work contact occurs, in the way we agree.” Offer, do not impose; the other person may need
      something different or no discussion."
  - heading: Respect their response
    body: A hurt person may be angry, uncertain, or unwilling to talk. They do not owe comfort or
      forgiveness. If either person feels threatened or controlled, stop joint work and seek
      individual specialist help.
takeaway:
  question: Which response takes responsibility without demanding forgiveness?
  options:
    - “I hid the contact, and I am sorry; would you like to hear one change I can make?”
    - “I said sorry, so you need to move on.”
    - “I did it because you were distant.”
  answer: 0
  explanation: Ownership names the choice and leaves the other person free to respond.
