id: hai-lesson-why-reactions-can-linger
module: healing-after-infidelity
type: lesson
title: Why reactions can linger
summary: Understand reminders without treating them as a diagnosis.
minutes: 4
mode: solo
intensity: medium
cards:
  - heading: A reminder can arrive unexpectedly
    body: A song, a delayed reply, or an ordinary place may bring the event back to mind. Your reaction
      can vary from day to day; neither intensity nor calm proves what decision you should make.
  - heading: Name the present moment
    body: "If a reminder arrives, notice what is happening now: “I heard that song and my chest
      tightened.” Look around, feel your feet on the floor, or name three ordinary objects. Skip any
      technique that makes you feel worse."
  - heading: Separate comfort from investigation
    body: "Ask what is needed in the next ten minutes: water, space, sleep, a trusted person, or writing
      a question for later. You do not need to chase every detail to take your feelings seriously."
  - heading: Get additional support
    body: If intrusive thoughts, sleep disruption or distress are persistent or interfere with daily
      life, consider an individual mental health professional. If you feel controlled or afraid,
      contact a domestic abuse specialist from a device you consider safe.
takeaway:
  question: A reminder appears while you are trying to work. What is a useful first step?
  options:
    - Force yourself to settle the relationship today
    - Notice the reminder and choose a small present-focused support
    - Demand immediate access to someone else’s phone
  answer: 1
  explanation: Settling first creates room for choice; it does not minimize the hurt.
