id: hai-lesson-context-is-not-an-excuse
module: healing-after-infidelity
type: lesson
title: Context is not an excuse
summary: Explore relationship context without assigning blame for someone else’s choices.
minutes: 4
mode: solo
intensity: medium
cards:
  - heading: Two questions, not one
    body: “What conditions were present?” and “Who chose the behavior?” are different questions.
      Loneliness, conflict, or opportunity may be relevant context; they do not make another person
      responsible for a breach of trust.
  - heading: Choose what is worth examining
    body: A person might notice they avoided difficult conversations or ignored their own boundaries.
      Examine your own choices without treating a partner’s actions as your fault. No one is
      obligated to search for their contribution.
  - heading: Make a small forward-looking request
    body: "If both people freely want to discuss the relationship, replace a global verdict with a
      specific request: “Can we set aside ten minutes on Sunday to talk about our schedules?” A
      request can be declined or renegotiated."
  - heading: Do not use context to bypass safety
    body: Threats, intimidation, coercive control and violence are not mutual communication problems. Do
      not use a joint exercise to fix them; contact an individual domestic abuse specialist when
      safe.
takeaway:
  question: How can you examine context without excusing a betrayal?
  options:
    - Make the hurt person responsible for the choice
    - Distinguish relationship conditions from the individual’s decision
    - Assume both people share equal responsibility
  answer: 1
  explanation: Understanding context does not transfer responsibility.
