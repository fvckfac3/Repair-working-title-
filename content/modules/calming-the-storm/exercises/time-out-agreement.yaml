id: cts-ex-time-out-agreement
module: calming-the-storm
type: exercise
title: Our time-out agreement
summary: Draft the rules for pausing a fight, then confirm them together.
minutes: 10
mode: together
intensity: light
intro: >-
  A time-out works best when you've agreed on it while calm. Fill this in
  together, or each draft it and compare.
steps:
  - id: signal
    kind: text
    prompt: "What's our signal? (a word, a phrase, a hand gesture, for example \"timeout\" or \"I'm getting flooded\")"
  - id: length
    kind: choice
    prompt: How long is a standard break?
    options: [20 minutes, 30 minutes, 1 hour, "Whoever calls it says how long"]
  - id: where
    kind: text
    prompt: Where will each of us go during a break?
  - id: return
    kind: text
    prompt: If both people want to return later, how could we check whether it feels safe and workable?
  - id: max
    kind: choice
    prompt: If both want to revisit this, when might we check in about it?
    options: [Same day, Another day, "Next weekly check-in", "Decide later or not at all"]
  - id: promise
    kind: instruction
    prompt: >-
      Either person may call a time-out, leave the conversation, and decide
      not to resume. A break should never be used to restrict someone's safety
      or ability to leave. If you feel afraid or controlled, seek individual support.
outro: Your responses are saved on this device. This does not create a shared agreement or send anything to a partner.
