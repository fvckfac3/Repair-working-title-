id: dc-lesson-attachment-in-couples
module: deepening-connection
type: lesson
title: Attachment in couples
summary: Notice patterns of reaching and making space without assigning fixed types.
minutes: 4
mode: solo
intensity: medium
cards:
  - heading: Needs can differ by moment
    body: When stressed, one person may want closeness while another wants quiet. The same person can
      want both at different times. These patterns are not fixed personality labels or diagnoses.
  - heading: The loop can amplify uncertainty
    body: One person asks repeatedly for reassurance; the other takes more space; the first asks again.
      Either can notice the loop without assuming equal responsibility for harmful behavior or
      control.
  - heading: Make the need specific
    body: Instead of “You never care,” try “I am unsettled; would a five-minute check-in be possible?”
      Instead of disappearing, if safe, try “I need quiet tonight; I can check whether tomorrow
      works.”
  - heading: No pattern excuses harm
    body: Fear, coercion, threats or violence are not attachment-style differences to solve together.
      Seek individual specialist support; no one owes closeness or a return to conversation.
takeaway:
  question: How should attachment ideas be used here?
  options:
    - As flexible clues about needs, not labels or diagnoses
    - As proof that someone is permanently one type
    - As an excuse for controlling behavior
  answer: 0
  explanation: Context changes, and labels cannot determine what a person needs.
