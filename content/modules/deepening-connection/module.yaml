slug: deepening-connection
title: Deepening Connection
tier: C
order: 7
tagline: From roommates back to partners.
description: >-
  Distance rarely arrives all at once. It builds up from missed moments.
  This module explains bids for connection and attachment needs, and it
  shows how to soften: letting your partner see the hurt or fear under the
  anger, so they can move toward you.
status: draft
intensity: medium
