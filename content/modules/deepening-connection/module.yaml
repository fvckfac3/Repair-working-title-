slug: deepening-connection
title: Deepening Connection
tier: C
order: 7
tagline: Make room for curiosity, responsiveness, and choice.
description: Learn to notice invitations for connection, express a need in your own words, and make
  small, voluntary moments of attention. Connection need not involve touch or disclosure. This
  educational module is not therapy; if fear, coercion or violence is present, prioritize individual
  safety and specialist support rather than joint activities.
intensity: medium
outline:
  assessment: Connection Check
  lessons:
    - Bids for connection
    - Attachment in couples
    - Softening
    - Staying curious about each other
    - Being reachable
  exercises:
    - Bids tracker
    - How well do you know me now?
    - My softer emotions
    - Attachment-needs cards
  conversations:
    - Reaching for each other
    - The daily stress-reducing conversation
  journal: When I feel closest to you
  ritual: 14 days of small connection
status: in_review
