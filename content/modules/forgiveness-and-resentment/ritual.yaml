id: far-ritual-letting-go
module: forgiveness-and-resentment
type: ritual
title: A letting-go ceremony
summary: Mark an optional change in how you carry one hurt.
minutes: 5
mode: solo
intensity: light
intro: This is a private, one-day ritual, not a requirement to forgive, reconcile, destroy evidence,
  or abandon a boundary. Do it only if it feels right; you may choose not to let anything go.
days:
  - day: 1
    task: Choose one manageable burden, such as the expectation that you must solve everything today.
      Write or say what you want to keep (a lesson or boundary) and what, if anything, you want to
      put down for now. Mark the moment with a breath, a walk, or a small gesture. End by choosing
      one supportive next step; revisit whenever you choose.
