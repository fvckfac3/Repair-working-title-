id: far-lesson-resentment-as-an-unmet-need
module: forgiveness-and-resentment
type: lesson
title: Resentment as an unmet need
summary: Use resentment as information, not a verdict or an instruction.
minutes: 4
mode: solo
intensity: medium
cards:
  - heading: Find the particular moment
    body: "“I resent everything” is hard to act on. Choose a smaller example: “When I covered the
      appointment alone, I felt overlooked.” You do not have to minimize repeated or serious harm to
      pick one example."
  - heading: Look for the need underneath
    body: "Ask what mattered: fairness, rest, acknowledgment, reliability, or choice. Resentment may
      point to an unmet need, but it can also signal an ongoing boundary violation or danger."
  - heading: Decide who can act
    body: "Some needs can be addressed independently, such as arranging time off. Others require a
      voluntary request: “Would you take the next appointment?” A request is not an agreement until
      the other person accepts it."
  - heading: Notice what happens next
    body: If an agreed action is repeatedly missed, reassess the agreement and your own options rather
      than treating your resentment as the sole problem. Seek support where the situation feels
      unsafe.
takeaway:
  question: "A useful question about a recurring resentment is:"
  options:
    - “What need or boundary might this be pointing to?”
    - “How can I force myself never to feel it?”
    - “How can I make the other person agree?”
  answer: 0
  explanation: The feeling may provide information; you still choose what to do with it.
