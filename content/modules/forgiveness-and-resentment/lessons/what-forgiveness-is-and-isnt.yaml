id: far-lesson-what-forgiveness-is-and-isnt
module: forgiveness-and-resentment
type: lesson
title: What forgiveness is and isn't
summary: Separate an optional internal choice from excusing, trusting, or reconnecting.
minutes: 4
mode: solo
intensity: medium
cards:
  - heading: There is no obligation
    body: Some people describe forgiveness as changing their relationship to resentment; others do not
      find the word useful. You are not required to forgive to heal, be a good partner, or complete
      these activities.
  - heading: Four different decisions
    body: Forgiving, if you choose it, is not the same as saying the behavior was acceptable. It also
      does not automatically restore trust, remove consequences, or require reconciliation or
      contact.
  - heading: Boundaries still count
    body: You can say “I do not want to discuss that tonight” or choose distance while deciding how you
      feel. A boundary describes what you will do; it is not a tool for controlling the other
      person.
  - heading: Safety is not a forgiveness project
    body: If someone frightens, controls, threatens, or harms you, do not use a joint activity to make
      the situation feel normal. Seek an individual domestic abuse specialist using a device you
      consider safe.
takeaway:
  question: Which choice can coexist with forgiveness, if someone freely chooses it?
  options:
    - Maintaining a boundary or ending contact
    - Pretending the harm was acceptable
    - Restoring trust immediately
  answer: 0
  explanation: Forgiveness, boundaries, and trust are separate decisions.
