id: far-lesson-forgiving-yourself
module: forgiveness-and-resentment
type: lesson
title: Forgiving yourself
summary: Take responsibility for your own choices without turning shame into a life sentence.
minutes: 4
mode: solo
intensity: medium
cards:
  - heading: Describe a choice precisely
    body: "Replace “I am terrible” with a specific action: “I canceled without telling them.” If someone
      harmed or controlled you, responsibility for their behavior belongs to them, not to you."
  - heading: Face the effect without a defense
    body: Notice the likely impact and what you do not know. An apology can name the action and impact,
      without “but” or a demand that the other person make you feel better.
  - heading: Make amends where appropriate
    body: Ask if an offer would be welcome; accept no. Choose a realistic change such as sending notice
      earlier next time. Sometimes respecting distance is the most appropriate action.
  - heading: Practice a humane next step
    body: "Guilt can point to an action to repair; global shame can keep you stuck. Try: “I can regret
      that choice and still take a useful step.” You do not need someone else’s forgiveness to take
      responsibility."
takeaway:
  question: What is a constructive self-forgiveness practice?
  options:
    - Name a specific choice, acknowledge impact, and take a feasible step
    - Insist the other person absolve you
    - Take responsibility for someone else’s abuse
  answer: 0
  explanation: Accountability and self-compassion can coexist without demanding a response.
