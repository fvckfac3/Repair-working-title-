tagline: Make room for your needs without erasing what happened.
description: Explore old hurts, identify what still needs attention, and consider boundaries or
  amends. Forgiveness is optional and separate from reconciliation, trust, or continued contact.
  These educational activities are not therapy; if fear, coercion or violence is present, prioritize
  individual safety and specialist support instead of joint work.
