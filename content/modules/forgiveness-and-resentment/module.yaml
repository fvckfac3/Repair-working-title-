  exercises:
    - Inventory of old hurts
    - The unsent letter
    - The hurt vs. the story
    - Choosing what to bring forward
  conversations:
    - Bringing up an old hurt safely
    - Offering and receiving amends
  journal: What I'm still carrying
  ritual: A letting-go ceremony
