slug: communicating-without-wounding
title: Communicating Without Wounding
tier: A
order: 2
tagline: Say the hard thing in a way your partner can hear.
description: >-
  Most couples who struggle aren't short on words. Their words land as
  attacks, so the other person defends. You'll learn to turn criticism into
  a request, listen until your partner feels understood, and validate
  without having to agree.
status: draft
intensity: light
outline:
  assessment: Communication Patterns
  lessons:
    - Complaints vs. criticism
    - The gentle start-up
    - Listening to understand
    - Validation isn't agreement
    - Contempt and its antidote
    - Catching defensiveness
  exercises:
    - Rewrite the criticism
    - My feelings & needs vocabulary
    - From "you always" to "I need"
    - Reflective listening practice
  conversations:
    - Speaker-listener practice
    - What I meant vs. what you heard
    - State of Us (weekly)
  journal: What I wish I'd said
  ritual: 14 days of one appreciation and one curious question
