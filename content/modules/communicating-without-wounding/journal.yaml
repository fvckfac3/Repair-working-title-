id: cww-journal-what-i-wish
module: communicating-without-wounding
type: journal
title: What I wish I'd said
summary: Reflect on your words, needs, and boundaries without having to share.
minutes: 7
mode: solo
intensity: light
intro: Write only what feels safe; you can skip any prompt or stop. You do not have to share or turn
  this into a conversation. If fear, coercion, or violence is present, consider individual
  specialized support.
prompts:
  - What happened in one moment, and what did I actually say?
  - What feeling and need were present for me? What do I know, and what am I assuming?
  - If I could rewrite one sentence without erasing my boundary, what might I say?
  - What response or boundary would I want if I am interrupted, insulted, or pressured?
  - Would speaking about this be safe and useful for me? What other support or next step could I
    choose?
