id: cww-lesson-gentle-start
module: communicating-without-wounding
type: lesson
title: The gentle start-up
summary: Use a feeling, a situation, and a doable request without suppressing a boundary.
minutes: 4
mode: solo
intensity: light
cards:
  - heading: Start with one moment
    body: Choose a calm time and ask whether the other person is willing to talk. “Is now okay to talk
      for ten minutes about the grocery plan?” If either says no, you can stop.
  - heading: Name situation, feeling, and need
    body: "Try: “When our plan for groceries changed without a message, I felt stressed because I need
      notice. Could you text me if the plan changes?” Avoid assuming intent or requiring a
      particular response."
  - heading: Check that the request can be answered
    body: Make it specific about action and timing. “Text before 5 if you cannot shop” is clearer than
      “be more considerate.” Ask what would be workable for the other person.
  - heading: If the response is not respectful
    body: A gentle start cannot control another person’s behavior. End the exchange if it becomes
      insulting or frightening. You may keep your boundary regardless of whether the other person
      agrees.
takeaway:
  question: What makes a request easier to answer?
  options:
    - It names a specific action and time.
    - It proves your partner meant harm.
    - It leaves no room for disagreement.
  answer: 0
  explanation: A clear request makes possible responses visible; it is not a demand.
