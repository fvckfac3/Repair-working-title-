tagline: Explore the values, roles, and possibilities that matter to you.
description: Reflect on what gives your life meaning, how daily rituals and roles work in practice,
  and what you hope for the future. If both people freely choose and feel safe, compare perspectives
  in conversation without demanding agreement or a shared future. If fear, coercion or violence is
  present, prioritize specialist individual support rather than couples activities.
