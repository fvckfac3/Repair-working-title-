tagline: Make room for choice, comfort, and honest conversations about closeness.
description: For adults, explore how desire, circumstances, health and different preferences affect
  the closeness you want. Reflect individually on boundaries and interests, and consider optional
  conversations or affection only when both freely choose them. The app does not match or compare
