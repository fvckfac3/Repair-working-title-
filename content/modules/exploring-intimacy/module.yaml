tagline: Rebuild physical closeness with less pressure and more honesty.
description: >-
  Sex is often the first casualty of conflict and the hardest thing to talk
  about. This module covers desire differences, responsive vs. spontaneous
  desire, and what speeds up or slows down each partner's interest. It
  offers a gradual, no-pressure path back to touch and a private way to
  share interests in which only mutual matches are shown.
