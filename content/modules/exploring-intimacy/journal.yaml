id: ei-journal-closeness
module: exploring-intimacy
type: journal
title: What closeness means to me
summary: Reflect on the forms of closeness, space, and choice that matter to you.
minutes: 7
mode: solo
intensity: deep
intro: For adults. Write only what feels safe and useful; you can skip anything. This is a personal
  reflection, not a commitment to share or act.
prompts:
  - When have I felt connected or at ease, with or without another person?
  - What kinds of closeness do I want now, if any? What do I not want?
  - What helps me recognize a genuine yes, a no, or uncertainty in myself?
  - What circumstances or health questions deserve care without making me responsible for anyone
    else’s expectations?
  - What supportive next step would respect my choices? If fear, coercion, or violence is present,
    what specialist individual support could I consider safely?
