id: ei-lesson-responsive-desire
module: exploring-intimacy
type: lesson
title: Spontaneous vs. responsive desire
summary: Recognize different ways interest can appear without treating a pattern as a rule.
minutes: 4
mode: solo
intensity: deep
cards:
  - heading: Two possible patterns
    body: Some people notice interest before any intimate context; others sometimes notice it after
      feeling relaxed, connected, or engaged in something they already welcome. These are
      descriptions, not fixed types, and neither is more mature or more valid.
  - heading: Response is not a promise
    body: Responsive desire does not mean someone should start an activity they do not want to see if
      desire appears. They may prefer no activity at all. A comfortable context can support choice,
      but it cannot create an obligation or guarantee interest.
  - heading: Notice variation
    body: Consider a recent moment when you did want some form of closeness. What was happening
      beforehand? Consider a time you did not. Sleep, privacy, workload, mood, medication,
      relationship context, and many other factors may matter differently from day to day.
  - heading: Make room for uncertainty
    body: A useful answer can be “not now,” “I do not know,” or “only a conversation.” Ask for what you
      want rather than testing another person. If the response is anything other than a freely given
      yes to that specific activity, do not proceed.
takeaway:
  question: What does responsive desire imply?
  options:
    - A person owes their partner a trial of touch
    - Desire can sometimes emerge in a welcome context, but never has to
    - A person has one permanent desire type
  answer: 1
  explanation: Context may matter, but an activity is optional from the start and throughout.
