id: ei-lesson-rebuilding-affection
module: exploring-intimacy
type: lesson
title: Rebuilding affection after distance or betrayal
summary: Consider connection at a pace that does not assume touch or forgiveness.
minutes: 4
mode: solo
intensity: deep
cards:
  - heading: Distance may make sense
    body: After conflict, a health change, or a breach of trust, closeness may feel complicated. There
      is no timetable for wanting contact and no exercise that repairs trust on its own. Addressing
      harm and respecting boundaries matter more than demonstrating affection.
  - heading: Connection has many forms
    body: For some, sharing a cup of tea, a kind word, sitting nearby, or having personal space feels
      connecting. Touch is only one option and can be unwelcome. Ask what would feel comfortable
      rather than assuming a gesture is harmless.
  - heading: Ask about this moment
    body: "If both people want a gesture, name it specifically: “Would you like to sit next to me for
      five minutes?” Accept “no,” “not sure,” or no answer without sulking or bargaining. A yes to
      one gesture is not consent to another."
  - heading: Let the person set the pace
    body: A person can stop or change their mind at any time, even after saying yes. Avoid turning
      affectionate moments into a test or a route to sex. If fear, coercion, or violence is present,
      skip joint exercises and seek specialist individual support.
takeaway:
  question: What is a safe starting assumption?
  options:
    - A hug is always harmless
    - Connection might include no touch, and either person may stop
    - Affection is proof that past harm is resolved
  answer: 1
  explanation: Connection can be nonphysical, and choice remains active.
