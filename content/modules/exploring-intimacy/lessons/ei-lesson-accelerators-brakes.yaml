id: ei-lesson-accelerators-brakes
module: exploring-intimacy
type: lesson
title: Accelerators and brakes
summary: Map conditions that make closeness more or less appealing to you.
minutes: 4
mode: solo
intensity: deep
cards:
  - heading: A practical metaphor
    body: An accelerator is something that can support interest; a brake is something that can make
      interest less likely. The same situation can affect people differently. These are
      observations, not levers one person can use to get the other to agree.
  - heading: Look beyond romance
    body: A sense of privacy, time to decompress, feeling respected, sensory preferences, and mental
      load might affect interest. A person may also have no identifiable reason. Make two lists of
      your own examples rather than guessing what works for someone else.
  - heading: A brake is useful information
    body: Pain, exhaustion, resentment, interruptions, or worry can be a reason to stop or choose
      another activity. Removing a brake is not a bargain that earns sex. If pain is a concern, stop
      the painful activity and consider a qualified clinician.
  - heading: Try one low-stakes adjustment
    body: If you wish, choose an adjustment that is useful on its own, such as protecting twenty minutes
      of quiet or sharing a chore more fairly. Later ask yourself whether it helped your wellbeing.
      Do not measure success by whether sex happened.
takeaway:
  question: If a brake is removed, what follows?
  options:
    - Consent is still needed, and either person can still say no
    - Sex is now owed
    - The person must explain any remaining reluctance
  answer: 0
  explanation: A more comfortable context never obliges an intimate activity.
