id: ei-lesson-desire-differences
module: exploring-intimacy
type: lesson
title: Desire differences are normal
summary: Differences in interest are information, not a verdict about either person.
minutes: 4
mode: solo
intensity: deep
cards:
  - heading: There is no required frequency
    body: People differ in whether, when, and how they want sexual or physical closeness. Desire can
      change with circumstances or over a lifetime, and a person may not want sex at all. A
      difference is not proof that someone is broken, unloving, or withholding.
  - heading: Name the impact, not a culprit
    body: "Different preferences can bring disappointment, relief, worry, or no distress. Notice your
      own feelings separately from a claim about your partner. Try: “I miss feeling wanted, and I
      want us both to be free to choose.” Do not assume the other person shares your
      interpretation."
  - heading: Protect the right to choose
    body: An invitation is not a request that must be granted. Neither partner owes sex, touch, an
      explanation, or a replacement activity. A no, uncertainty, silence, or a change of mind means
      stop; enthusiasm cannot be negotiated into existence.
  - heading: Find the actual question
    body: "Ask yourself what you miss: play, tenderness, reassurance, erotic interest, or quiet time?
      Then consider ways to meet that need that do not require another person to override a
      boundary. A shared conversation is optional and appropriate only when both feel safe and
      freely agree."
takeaway:
  question: Which response respects a difference in desire?
  options:
    - Treat either person as defective
    - Ask about needs while accepting that either person can decline
    - Keep persuading until someone agrees
  answer: 1
  explanation: Desire differences can be explored without setting a quota or overriding choice.
